      content="在聖誕節、情人節、生日與紀念日中選擇禮物，觀察女友反應與關係變化。完成《送禮大作戰》，看看你的送禮判斷會走向哪一種感情結局。"

    <meta name="twitter:title" content="送禮大作戰｜情侶送禮選擇遊戲" />
    <meta
      name="twitter:description"
      content="在聖誕節、情人節、生日與紀念日中選擇禮物，觀察女友反應與關係變化。完成《送禮大作戰》，看看你的送禮判斷會走向哪一種感情結局。"
    />

      name="twitter:image"
      content="https://twomoregames.space/gift-game/assets/social/gift-game-share-20261015.png"

    <link rel="icon" type="image/png" href="/gift-game/assets/question/heart.png" />
    <link rel="stylesheet" href="css/style.css?v=20261015-1" />
    <script src="js/data.js?v=20261016-1" defer></script>
    <script src="js/game.js?v=20261016-1" defer></script>
    <script src="/components/site-footer.js?v=20261013-2" defer></script>
  </head>
  <body class="intro-active">
    <main class="app-shell">
      <section class="intro" id="introScreen" aria-labelledby="introTitle">
        <div class="intro-layout">
          <img class="intro-badge" src="assets/intro/nice-badge.png" alt="" aria-hidden="true" />
          <h1 id="introTitle">
            <span>你夠了解</span>
            <span>女友想要什麼</span>
            <span><em>禮物</em>嗎？</span>
          </h1>
          <img
            class="intro-visual"
            src="assets/intro/main-image.webp"
            alt="兩個相依的愛心與黃色角色，置於 Test of Love 視窗中"
          />
          <div class="intro-cta">
            <img class="intro-cta-cursor" src="assets/question/decor/cursor.webp" alt="" aria-hidden="true" />
            <button class="primary-button" id="startButton" type="button">開始測試</button>
          </div>
        </div>

        <div class="intro-bottom-decor" aria-hidden="true">
          <img class="intro-decor intro-decor-console" src="assets/question/decor/console.webp" alt="" />
          <img class="intro-decor intro-decor-window" src="assets/question/decor/window.webp" alt="" />
          <img class="intro-decor intro-decor-folder" src="assets/question/decor/folder.webp" alt="" />
          <img class="intro-decor intro-decor-phone" src="assets/question/decor/phone.webp" alt="" />
        </div>
      </section>

      <section class="game hidden" id="gameScreen" aria-live="polite">
        <div class="question-screen-decor" aria-hidden="true">
          <img class="screen-decor screen-decor-console" src="assets/question/decor/console.webp" alt="" />
          <img class="screen-decor screen-decor-cursor" src="assets/question/decor/cursor.webp" alt="" />
          <img class="screen-decor screen-decor-folder" src="assets/question/decor/folder.webp" alt="" />
          <img class="screen-decor screen-decor-window" src="assets/question/decor/window.webp" alt="" />
          <img class="screen-decor screen-decor-phone" src="assets/question/decor/phone.webp" alt="" />
        </div>

        <div class="love-window question-window">
          <div class="love-window-panel">
            <div class="love-window-titlebar">
              <span>Test of Love</span>
              <span class="love-window-hearts" aria-hidden="true">
                <img src="assets/question/heart.png" alt="" />
                <img src="assets/question/heart.png" alt="" />
                <img src="assets/question/heart.png" alt="" />
              </span>
            </div>

            <div class="love-window-content question-window-content">
              <div class="question-patterns" aria-hidden="true">
                <span class="question-pattern question-pattern-checker"></span>
                <span class="question-pattern question-pattern-grid"></span>
              </div>

              <div class="relationship-panel">
                <label class="relationship-label" for="relationshipMeter">
                  <img src="assets/question/heart.png" alt="" />
                  <span>好感度</span>
                </label>
                <div class="relationship-meter">
                  <progress class="visually-hidden" id="relationshipMeter" max="100" value="30">30 / 100</progress>
                  <span class="relationship-meter-track" aria-hidden="true">
                    <span class="relationship-meter-fill" id="relationshipMeterFill">
                      <span class="meter-glint" id="meterGlint"></span>
                    </span>
                  </span>
                </div>
                <span class="visually-hidden">
                  目前關係值 <span id="relationshipScore">30</span> / 100
                </span>
              </div>

              <div class="question-main">
                <div class="question-card-decor" aria-hidden="true">
                  <img class="card-decor card-decor-lightning-left" src="assets/question/decor/lightning.webp" alt="" />
                  <img class="card-decor card-decor-lightning-right" src="assets/question/decor/lightning.webp" alt="" />
                  <img class="card-decor card-decor-heart-upper" src="assets/question/heart.png" alt="" />
                  <img class="card-decor card-decor-star-upper" src="assets/question/decor/star.webp" alt="" />
                  <img class="card-decor card-decor-key" src="assets/question/decor/key.webp" alt="" />
                  <img class="card-decor card-decor-spark-left" src="assets/question/decor/sparkle.webp" alt="" />
                  <img class="card-decor card-decor-spark-right" src="assets/question/decor/sparkle.webp" alt="" />
                  <img class="card-decor card-decor-star-side" src="assets/question/decor/star.webp" alt="" />
                </div>

                <div class="event-visual-stage">
                  <img class="girl-orbit-decor" src="assets/question/decor/girl-decor.svg" alt="" aria-hidden="true" />
                  <div class="girlfriend-character" id="eventIcon" aria-label="女友角色" role="img">
                    <img class="girlfriend-texture" src="assets/question/girl.webp" alt="" aria-hidden="true" />
                  </div>
                </div>

                <p class="relationship-days">
                  <img class="day-sticker" src="assets/question/day-sticker.png" alt="" aria-hidden="true" />
                  <span>共度的第</span>
                  <strong id="relationshipDays">55</strong>
                  <span>天</span>
                </p>

                <article class="event-card">
                  <h2 class="event-question" tabindex="-1">
                    <span id="eventLead">下禮拜是</span><strong id="eventTitle">聖誕節</strong>，<br />
                    <span id="eventPrompt">你準備送什麼禮物呢?</span>
                  </h2>
                </article>

                <div class="gift-grid" id="giftGrid" role="group" aria-label="禮物選項"></div>
              </div>
              <p class="girlfriend-reaction-bubble hidden" id="girlfriendReaction" aria-live="polite"></p>
            </div>
          </div>

          <div class="question-bottom-decor" aria-hidden="true">
            <img class="question-edge-decor question-edge-star" src="assets/question/decor/sparkle.webp" alt="" />
            <img class="question-edge-decor question-edge-heart" src="assets/question/heart.png" alt="" />
          </div>

          <aside class="boyfriend-thought" aria-label="男友碎碎念">
            <img class="boyfriend-decor boyfriend-decor-star" src="assets/question/decor/sparkle.webp" alt="" aria-hidden="true" />
            <img class="boyfriend-decor boyfriend-decor-heart" src="assets/question/heart.png" alt="" aria-hidden="true" />
            <div class="boyfriend-visual" role="img" aria-label="男友角色">
              <img class="boyfriend-texture" src="assets/question/boy.webp" alt="" aria-hidden="true" />
            </div>
            <p id="boyfriendThought">送什麼好呢...</p>
          </aside>
        </div>
      </section>

      <section class="ending hidden" id="endingScreen" aria-labelledby="endingTitle">
        <div class="love-window result-window">
          <div class="love-window-panel">
            <div class="love-window-titlebar">
              <span>Test of Love</span>
              <span class="love-window-hearts" aria-hidden="true">
                <img src="assets/question/heart.png" alt="" />
                <img src="assets/question/heart.png" alt="" />
                <img src="assets/question/heart.png" alt="" />
              </span>
            </div>
            <div class="love-window-content result-window-content">
              <div class="result-pattern" aria-hidden="true"></div>
              <div class="result-fixed-layout">
                <div class="result-score-background" aria-hidden="true">
                  <img class="result-decor result-decor-score-burst" src="assets/result/score-burst.png" alt="" />
                </div>
                <div class="result-score-decor" aria-hidden="true">
                  <img class="result-score-decor-image" src="assets/result/score-decor.png" alt="" />
                </div>
                <p class="result-label">你的戀愛求生指數</p>
                <strong class="result-score" id="endingScore">0</strong>
                <h1 id="endingTitle" tabindex="-1"></h1>
                <div class="ending-visual" role="img" aria-label="別人家的男友角色">
                  <img class="ending-character-image" id="endingBoyfriendImage" src="assets/result/boyfriends/other-boyfriend.webp" alt="" aria-hidden="true" />
                </div>
                <p class="ending-description">
                  <span id="endingDescription"></span>
                  <strong id="endingPunchline"></strong>
                </p>
                <div class="result-stats" aria-label="送禮過程統計">
                  <section class="result-stat-card result-stat-mine" aria-labelledby="mineStatLabel">
                    <img class="result-stat-icon" src="assets/result/mine.png" alt="" aria-hidden="true" />
                    <span class="result-stat-heading" id="mineStatLabel">踩雷次數</span>
                    <p><strong id="mineCount">0</strong><span>次</span></p>
                    <div class="relationship-meter result-stat-meter" aria-hidden="true">
                      <span class="relationship-meter-track">
                        <span class="relationship-meter-fill" id="mineCountBar"><span class="meter-glint"></span></span>
                      </span>
                    </div>
                  </section>
                  <section class="result-stat-card result-stat-god" aria-labelledby="godGiftStatLabel">
                    <img class="result-stat-icon" src="assets/result/god-gift.png" alt="" aria-hidden="true" />
                    <span class="result-stat-heading" id="godGiftStatLabel">神級送禮</span>
                    <p><strong id="godGiftCount">0</strong><span>次</span></p>
                    <div class="relationship-meter result-stat-meter" aria-hidden="true">
                      <span class="relationship-meter-track">
                        <span class="relationship-meter-fill" id="godGiftCountBar"><span class="meter-glint"></span></span>
                      </span>
                    </div>
                  </section>
                </div>
              </div>
            </div>
          </div>
          <div class="result-actions">
            <img class="result-action-cursor" src="assets/question/decor/cursor.webp" alt="" aria-hidden="true" />
            <button
              class="result-share-button"
              id="copyGameLinkButton"
              type="button"
              data-default-label="複製連結分享給朋友"
              data-success-label="已複製到剪貼簿！"
              data-error-label="複製失敗，請再試一次"
              aria-live="polite"
            >複製連結分享給朋友</button>
            <button class="result-retry-button" id="playAgainButton" type="button">再測一次</button>
          </div>
        </div>
      </section>

      <site-footer current-page="game"></site-footer>
    </main>
  </body>
</html>
